name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} / smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    steps:
      - uses: actions/checkout@v4

      - name: Configure PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip, dom, openssl
          tools: none

      - name: Verify PHP runtime
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -m
          php -r '
            $required = ["pdo_sqlite", "zip", "dom", "openssl"];
            $missing = array_values(array_filter($required, static fn ($ext) => !extension_loaded($ext)));
            if ($missing !== []) {
                fwrite(STDERR, "Missing required PHP extensions: " . implode(", ", $missing) . PHP_EOL);
                exit(1);
            }
            if (!in_array("sqlite", PDO::getAvailableDrivers(), true)) {
                fwrite(STDERR, "PDO SQLite driver is unavailable." . PHP_EOL);
                exit(1);
            }
          '

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './.git' -prune -o -path './.github' -prune -o -name '*.php' -type f -print0)
          php -l bin/zknet

      - name: Run PHP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.php; do
            echo "::group::$test"
            php "$test"
            echo "::endgroup::"
          done
          echo "::group::tests/smoke.php"
          php tests/smoke.php
          echo "::endgroup::"

  javascript:
    name: JavaScript smoke tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find tests -maxdepth 1 -type f -name '*.js' -print0)
          node --check assets/app.js
          node --check assets/theme.js

      - name: Run JavaScript smoke tests
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test in tests/*.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Executed $count JavaScript smoke tests."

  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CHANGELOG.md
          test -s HANDOFF.md
          test -s INSTALL.md
          test -s SECURITY-REVIEW.md
          test -s SHA256SUMS.txt
          test -s web.config

      - name: Verify checksum entries that are part of this IIS repository
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          manifest = Path("SHA256SUMS.txt")
          checked = 0
          missing = []
          failures = []
          for raw in manifest.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              expected, relative = line.split(None, 1)
              relative = relative.lstrip("*").removeprefix("./")
              path = Path(relative)
              if not path.is_file():
                  missing.append(relative)
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  failures.append(relative)
              checked += 1
          for item in missing:
              print(f"INFO: checksum entry absent from IIS repository: {item}")
          if failures:
              raise SystemExit("Checksum mismatch: " + ", ".join(failures))
          if checked == 0:
              raise SystemExit("No checksum entries were validated.")
          print(f"Verified {checked} present-file SHA-256 entries.")
          PY

      - name: Prevent runtime secrets and databases in Git
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name 'app.key' \) -not -path './.git/*' | grep -q .; then
            echo "Runtime database or encryption key must not be committed." >&2
            exit 1
          fi

      - name: Ensure historical migrations are present
        shell: bash
        run: |
          set -euo pipefail
          test -s database/migrations/001_initial.php
          test -s database/migrations/002_department_responsible.php
          test -s database/migrations/003_user_accounts_and_roles.php
          test -s database/migrations/004_department_discovery.php
          test -s database/migrations/005_account_lockout_and_sessions.php
