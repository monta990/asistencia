name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip, dom, openssl
          tools: none

      - name: Verify PHP runtime and required extensions
        run: |
          php --version
          php -m
          php -r '
            $required = ["pdo_sqlite", "zip", "dom", "openssl"];
            $missing = array_values(array_filter($required, static fn ($ext) => !extension_loaded($ext)));
            if ($missing !== []) {
                fwrite(STDERR, "Missing required extensions: " . implode(", ", $missing) . PHP_EOL);
                exit(1);
            }
            if (!in_array("sqlite", PDO::getAvailableDrivers(), true)) {
                fwrite(STDERR, "PDO SQLite driver is unavailable." . PHP_EOL);
                exit(1);
            }
          '

      - name: PHP syntax checks
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -path './.github' -prune -o -name '*.php' -type f -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

      - name: PHP smoke and integration tests
        run: |
          set -euo pipefail
          for test in tests/*-smoke.php; do
            echo "::group::$test"
            php "$test"
            echo "::endgroup::"
          done
          echo "::group::tests/smoke.php"
          php tests/smoke.php
          echo "::endgroup::"

      - name: Validate CLI entry point
        run: php -l bin/zknet

  javascript-tests:
    name: JavaScript smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node.js syntax checks
        run: |
          set -euo pipefail
          node --version
          find tests -maxdepth 1 -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done
          node --check assets/app.js
          node --check assets/theme.js

      - name: Run JavaScript smoke tests
        run: |
          set -euo pipefail
          count=0
          for test in tests/*.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Executed $count JavaScript smoke tests."

  repository-integrity:
    name: Repository and migration integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migration checksums and repository metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f HANDOFF.md
          test -f INSTALL.md
          test -f SECURITY-REVIEW.md
          test -f SHA256SUMS.txt
          test -f web.config
          grep -q '001_initial.php' database/migrations/README.md
          grep -q '005_account_lockout_and_sessions.php' database/migrations/README.md
          sha256sum --check SHA256SUMS.txt
          if find . -type f \( -name '*.sqlite' -o -name '*.db' -o -name 'app.key' \) -not -path './.git/*' | grep -q .; then
            echo "Unexpected runtime database or encryption key committed to the repository." >&2
            exit 1
          fi
