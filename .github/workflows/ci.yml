name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} / smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.5'
          - '8.6'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip, dom, openssl
          tools: none

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -m
          php -r '
            $required = ["pdo_sqlite", "zip", "dom", "openssl"];
            $missing = array_values(array_filter($required, static fn ($ext) => !extension_loaded($ext)));
            if ($missing !== []) {
                fwrite(STDERR, "Missing required PHP extensions: " . implode(", ", $missing) . PHP_EOL);
                exit(1);
            }
            if (!in_array("sqlite", PDO::getAvailableDrivers(), true)) {
                fwrite(STDERR, "PDO SQLite driver is unavailable." . PHP_EOL);
                exit(1);
            }
          '

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './.git' -prune -o -path './.github' -prune -o -name '*.php' -type f -print0)
          php -l bin/zknet

      - name: Run PHP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.php; do
            echo "::group::$test"
            php "$test"
            echo "::endgroup::"
          done
          echo "::group::tests/smoke.php"
          php tests/smoke.php
          echo "::endgroup::"

  javascript:
    name: JavaScript smoke tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find tests -maxdepth 1 -type f -name '*.js' -print0)
          node --check assets/app.js
          node --check assets/theme.js

      - name: Run JavaScript smoke tests
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test in tests/*.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Executed $count JavaScript smoke tests."

  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md CHANGELOG.md HANDOFF.md INSTALL.md SECURITY-REVIEW.md SHA256SUMS.txt web.config; do
            test -s "$file"
          done

      - name: Verify tracked checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt

      - name: Prevent runtime secrets and databases in Git
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \\( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name 'app.key' \\) -not -path './.git/*' | grep -q .; then
            echo "Runtime database or encryption key must not be committed." >&2
            exit 1
          fi

      - name: Ensure historical migrations are present
        shell: bash
        run: |
          set -euo pipefail
          for file in \\
            database/migrations/001_initial.php \\
            database/migrations/002_department_responsible.php \\
            database/migrations/003_user_accounts_and_roles.php \\
            database/migrations/004_department_discovery.php \\
            database/migrations/005_account_lockout_and_sessions.php; do
            test -s "$file"
          done
